<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="System architecture of the LinkedIn Growth Agent">
<rect width="1200" height="800" fill="#0d1526"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/></marker>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8def"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
</defs>
<text x="40" y="48" fill="#e8eefc" font-size="24" font-weight="bold">System architecture</text>
<text x="40" y="74" fill="#93a4c4" font-size="14">Local first. The dashboard and the extension talk only to the local backend. Nothing talks to LinkedIn.</text>
<rect x="30" y="100" width="300" height="330" rx="12" fill="none" stroke="#2a3a5c" stroke-dasharray="5 4"/>
<text x="42" y="122" fill="#93a4c4" font-size="13" font-weight="bold" letter-spacing="1">ON YOUR COMPUTER</text>
<rect x="50" y="140" width="260" height="120" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="50" y="140" width="5" height="120" rx="2" fill="#5b8def"/>
<text x="68" y="164" fill="#e8eefc" font-size="15" font-weight="bold">Dashboard</text>
<text x="68" y="186" fill="#93a4c4" font-size="12.5">Single page app</text>
<text x="68" y="205" fill="#93a4c4" font-size="12.5">index.html, styles.css</text>
<text x="68" y="224" fill="#93a4c4" font-size="12.5">app.js built to app.min.js</text>
<text x="68" y="243" fill="#93a4c4" font-size="12.5">13 pages</text>
<rect x="50" y="290" width="260" height="120" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="50" y="290" width="5" height="120" rx="2" fill="#5b8def"/>
<text x="68" y="314" fill="#e8eefc" font-size="15" font-weight="bold">Chrome extension</text>
<text x="68" y="336" fill="#93a4c4" font-size="12.5">Manifest V3, v0.2.0</text>
<text x="68" y="355" fill="#93a4c4" font-size="12.5">Side panel and popup</text>
<text x="68" y="374" fill="#93a4c4" font-size="12.5">Reads visible page text only</text>
<rect x="380" y="100" width="420" height="560" rx="12" fill="none" stroke="#2a3a5c" stroke-dasharray="5 4"/>
<text x="392" y="122" fill="#93a4c4" font-size="13" font-weight="bold" letter-spacing="1">LOCAL BACKEND: NODE 20, EXPRESS 5, PORT 3000</text>
<rect x="400" y="140" width="380" height="96" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="400" y="140" width="5" height="96" rx="2" fill="#2dd4bf"/>
<text x="418" y="164" fill="#e8eefc" font-size="15" font-weight="bold">REST API</text>
<text x="418" y="186" fill="#93a4c4" font-size="12.5">Auth on every route</text>
<text x="418" y="205" fill="#93a4c4" font-size="12.5">Bearer token, scrypt password</text>
<text x="418" y="224" fill="#93a4c4" font-size="12.5">Static dashboard, SPA fallback</text>
<rect x="400" y="256" width="380" height="96" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="400" y="256" width="5" height="96" rx="2" fill="#2dd4bf"/>
<text x="418" y="280" fill="#e8eefc" font-size="15" font-weight="bold">Chief Growth Strategist</text>
<text x="418" y="302" fill="#93a4c4" font-size="12.5">Classifies the request</text>
<text x="418" y="321" fill="#93a4c4" font-size="12.5">Gathers real DB evidence</text>
<text x="418" y="340" fill="#93a4c4" font-size="12.5">Stores recommendations</text>
<rect x="400" y="372" width="380" height="96" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="400" y="372" width="5" height="96" rx="2" fill="#2dd4bf"/>
<text x="418" y="396" fill="#e8eefc" font-size="15" font-weight="bold">OpenRouter proxy</text>
<text x="418" y="418" fill="#93a4c4" font-size="12.5">Key stays server side only</text>
<text x="418" y="437" fill="#93a4c4" font-size="12.5">Free models only, 12 model chain</text>
<text x="418" y="456" fill="#93a4c4" font-size="12.5">Structured JSON validation</text>
<rect x="400" y="488" width="380" height="96" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="400" y="488" width="5" height="96" rx="2" fill="#f87171"/>
<text x="418" y="512" fill="#e8eefc" font-size="15" font-weight="bold">Compliance: kill switch</text>
<text x="418" y="534" fill="#93a4c4" font-size="12.5">Blocks AI and draft approval</text>
<text x="418" y="553" fill="#93a4c4" font-size="12.5">403 kill_switch_on</text>
<text x="418" y="572" fill="#93a4c4" font-size="12.5">Every action in the audit log</text>
<rect x="850" y="100" width="320" height="330" rx="12" fill="none" stroke="#2a3a5c" stroke-dasharray="5 4"/>
<text x="862" y="122" fill="#93a4c4" font-size="13" font-weight="bold" letter-spacing="1">DATA AND AI</text>
<rect x="870" y="140" width="280" height="120" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="870" y="140" width="5" height="120" rx="2" fill="#5b8def"/>
<text x="888" y="164" fill="#e8eefc" font-size="15" font-weight="bold">SQLite</text>
<text x="888" y="186" fill="#93a4c4" font-size="12.5">backend/data/app.db</text>
<text x="888" y="205" fill="#93a4c4" font-size="12.5">13 tables, WAL mode</text>
<text x="888" y="224" fill="#93a4c4" font-size="12.5">Users, prospects, drafts,</text>
<text x="888" y="243" fill="#93a4c4" font-size="12.5">recommendations, audit log</text>
<rect x="870" y="290" width="280" height="120" rx="10" fill="#16213a" stroke="#2a3a5c"/>
<rect x="870" y="290" width="5" height="120" rx="2" fill="#5b8def"/>
<text x="888" y="314" fill="#e8eefc" font-size="15" font-weight="bold">OpenRouter API</text>
<text x="888" y="336" fill="#93a4c4" font-size="12.5">Chat completions endpoint</text>
<text x="888" y="355" fill="#93a4c4" font-size="12.5">Key validated on /auth/key</text>
<text x="888" y="374" fill="#93a4c4" font-size="12.5">429, timeout, or 5xx tries</text>
<text x="888" y="393" fill="#93a4c4" font-size="12.5">the next free model</text>
<text x="40" y="700" fill="#93a4c4" font-size="14">The OpenRouter API key lives in backend/.env (mode 0600) or the OPENROUTER_API_KEY environment variable. It is never logged and never returned to a client.</text>
<text x="40" y="726" fill="#93a4c4" font-size="14">The app has no LinkedIn API access and imports no LinkedIn data. All numbers are records entered in the app.</text>
<line x1="310" y1="200" x2="395" y2="190" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
<text x="352" y="178" fill="#93a4c4" font-size="12" text-anchor="middle">HTTP, localhost</text>
<line x1="310" y1="350" x2="395" y2="340" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
<text x="352" y="328" fill="#93a4c4" font-size="12" text-anchor="middle">HTTP, localhost</text>
<line x1="590" y1="236" x2="590" y2="252" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
<line x1="590" y1="352" x2="590" y2="368" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
<line x1="780" y1="420" x2="865" y2="420" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
<text x="822" y="402" fill="#93a4c4" font-size="12" text-anchor="middle">API key</text>
<line x1="590" y1="440" x2="590" y2="484" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
<line x1="780" y1="190" x2="865" y2="190" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr)"/>
<text x="822" y="172" fill="#93a4c4" font-size="12" text-anchor="middle">SQL</text>
<line x1="782" y1="310" x2="866" y2="232" stroke="#5b8def" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="824" y="268" fill="#5b8def" font-size="11" text-anchor="middle" transform="rotate(-43 824 268)">evidence</text>
</svg>
